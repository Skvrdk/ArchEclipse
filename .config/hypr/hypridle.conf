# Idle behaviour for the Hyprland session (same timings as KDE's power settings).
general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Display off after 15 minutes without input.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Sleep after 2 hours without input.
listener {
    timeout = 7200
    on-timeout = systemctl suspend
}
